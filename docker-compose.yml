version: '3.8'
services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: "exampledb"
      POSTGRES_USER: "exampleuser"
      POSTGRES_PASSWORD: "examplepass"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: ./Backend/.env
    restart: always

      
volumes:
  postgres_data: